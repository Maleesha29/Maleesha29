name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight (adjust as needed)
  workflow_dispatch: # Allows manual triggering

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate snake animation
        uses: Platane/snk@master
        with:
          github_user_name: Maleesha29
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push the generated snake animation
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          message: "Generated snake animation"
          add: "dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg"
